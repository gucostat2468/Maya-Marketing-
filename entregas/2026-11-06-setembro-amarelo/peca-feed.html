<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Setembro Amarelo - Feed 4:5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  /* Paleta PROVISÓRIA (observada na peça de referência; paleta oficial a confirmar) */
  :root {
    --fundo: #141414;
    --fundo-2: #1f1d1a;
    --dourado: #F2C230;      /* destaque dourado/amarelo */
    --dourado-escuro: #C9971A;
    --branco: #FFFFFF;
    --texto-apoio: #E6E2D8;
    --verde-emblema: #2FA84F; /* reservado ao emblema; não usado nesta peça */
    --fonte-titulo: "Montserrat", "Liberation Sans", Arial, sans-serif;
    --fonte-manuscrita: "Caveat", "Liberation Serif", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 900px 700px at 50% 30%, var(--fundo-2), var(--fundo) 70%);
    color: var(--branco);
    font-family: var(--fonte-titulo);
    position: relative;
  }
  .coluna {
    position: absolute; top: 0; left: 0; right: 0; bottom: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 0 70px;
  }
  .manuscrita {
    text-align: center;
    font-family: var(--fonte-manuscrita); font-weight: 700; font-size: 76px;
    color: var(--dourado); line-height: 1;
  }
  .laco { width: 230px; height: 357px; margin: 34px 0 46px; }
  .titulo {
    text-align: center; white-space: nowrap;
    font-weight: 900; font-size: 86px; line-height: 1.02; letter-spacing: -1px;
    text-transform: uppercase;
  }
  .titulo span { color: var(--dourado); }
  .apoio {
    text-align: center; margin-top: 34px;
    font-weight: 500; font-size: 38px; line-height: 1.3; color: var(--texto-apoio);
  }
  .ajuda {
    margin-top: 52px; width: 820px; border-radius: 28px; background: var(--dourado); color: var(--fundo);
    text-align: center; padding: 28px 30px 30px;
  }
  .ajuda .linha1 { font-weight: 900; font-size: 64px; line-height: 1.05; text-transform: uppercase; }
  .ajuda .linha2 { font-weight: 600; font-size: 32px; line-height: 1.3; margin-top: 8px; }
  .rodape {
    position: absolute; bottom: 52px; left: 90px; right: 90px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rodape .cvv { font-size: 22px; font-weight: 500; color: #B8B3A8; }
  .logo-espaco {
    width: 190px; height: 64px; border: 2px dashed #6E6A62; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; letter-spacing: 4px; color: #8A857B;
  }
</style>
</head>
<body>
  <main class="coluna">
  <div class="manuscrita">Setembro Amarelo</div>

  <!-- Laço do Setembro Amarelo: um traço contínuo que se cruza -->
  <svg class="laco" viewBox="0 0 200 310" aria-hidden="true">
    <path d="M150 288 C 118 214, 74 160, 70 96 C 66 40, 134 40, 130 96" fill="none"
          stroke="var(--dourado-escuro)" stroke-width="34" stroke-linecap="round"/>
    <path d="M50 288 C 82 214, 126 160, 130 96" fill="none"
          stroke="var(--dourado)" stroke-width="34" stroke-linecap="round"/>
  </svg>

  <h1 class="titulo">Falar sobre isso<br><span>também é cuidar.</span></h1>

  <p class="apoio">Se você não está bem, procure alguém.<br>Você não está sozinho.</p>

  <div class="ajuda">
    <div class="linha1">CVV: ligue 188</div>
    <div class="linha2">Gratuito, 24 horas &middot; cvv.org.br</div>
  </div>
  </main>

  <div class="rodape">
    <div class="cvv">CVV: Centro de Valorização da Vida</div>
    <div class="logo-espaco">LOGO</div>
  </div>
</body>
</html>
