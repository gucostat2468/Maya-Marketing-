<title>Equipe Maya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: um escritório visto de cima. Cada área é uma sala; cada agente é um robô na sua mesa. Clicar no robô abre a conversa com ele. */
:root {
  --bg: #f8faf9; --floor: #e4efe9; --room: #effaf5; --surface: #ffffff; --line: #cfe1d7;
  --fg: #0c2a22; --muted: #4d6359; --brand: #0d9448;
  --gold: #8a6410; --gold-soft: #f6ecd2; --green: #1d7a45; --green-soft: #dcefe2; --red: #a8322a; --red-soft: #f7e1de;
  --bot: #0c332a; --bot-face: #c9f2d8; --bot-eye: #0c332a; --screen: #091d19; --screen-glow: #43cb6d; --desk: #b7cfc2;
  --display: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1b14; --floor: #0c211a; --room: #0f2a21; --surface: #12322a; --line: #1f4538;
    --fg: #eef7f2; --muted: #9dbbad; --gold: #e2b44a; --gold-soft: #33290f; --green: #43cb6d; --green-soft: #123a2a; --red: #f08a7f; --red-soft: #3a1714; --brand: #43cb6d;
    --bot: #d8ece2; --bot-face: #0c332a; --bot-eye: #7bd26e; --screen: #06140f; --screen-glow: #43cb6d; --desk: #2a5444;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1b14; --floor: #0c211a; --room: #0f2a21; --surface: #12322a; --line: #1f4538;
  --fg: #eef7f2; --muted: #9dbbad; --gold: #e2b44a; --gold-soft: #33290f; --green: #43cb6d; --green-soft: #123a2a; --red: #f08a7f; --red-soft: #3a1714; --brand: #43cb6d;
  --bot: #d8ece2; --bot-face: #0c332a; --bot-eye: #7bd26e; --screen: #06140f; --screen-glow: #43cb6d; --desk: #2a5444;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.app.open { grid-template-columns: minmax(0, 1fr) min(440px, 100%); }
.office { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 400; }
.top h1 span { color: var(--brand); font-style: italic; }
.top small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.stat b { color: var(--fg); font-variant-numeric: tabular-nums; }
.sync { font-size: 13px; color: var(--muted); }
.sync.warn { color: var(--red); }

.floor { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; padding: 14px; border-radius: 14px; background:
  repeating-linear-gradient(0deg, transparent 0 39px, var(--line) 39px 40px), repeating-linear-gradient(90deg, transparent 0 39px, var(--line) 39px 40px), var(--floor); }
.room { flex: 1 1 auto; min-width: min(100%, 160px); background: var(--room); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.room h2 { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); }
.desks { display: flex; flex-wrap: wrap; gap: 6px 4px; }

/* Mesa com robô */
.station { position: relative; width: 132px; padding: 58px 4px 6px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 10px; }
.station:hover { background: color-mix(in oklab, var(--gold) 8%, transparent); }
.station[aria-pressed="true"] { background: color-mix(in oklab, var(--gold) 14%, transparent); }
.bubble { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 128px; padding: 5px 8px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-size: 11.5px; line-height: 1.3; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; }
.bubble::after { content: ""; position: absolute; bottom: -5px; left: 50%; width: 8px; height: 8px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble.quiet { color: var(--muted); }
.bubble.alert { border-color: var(--gold); background: var(--gold-soft); }
.bubble.alert::after { background: var(--gold-soft); border-color: var(--gold); }
.scene { position: relative; width: 112px; height: 92px; }
.name { font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.2; min-height: 2.4em; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.t-livre { background: var(--line); color: var(--muted); }
.t-trabalhando { background: var(--green-soft); color: var(--green); }
.t-aguardando { background: var(--gold-soft); color: var(--gold); }
.t-bloqueado { background: var(--red-soft); color: var(--red); }

/* Robô desenhado em CSS */
.bot { position: absolute; left: 50%; bottom: 26px; width: 54px; height: 62px; margin-left: -27px; }
.antenna { position: absolute; left: 50%; top: 0; width: 2px; height: 10px; margin-left: -1px; background: var(--bot); }
.led { position: absolute; left: 50%; top: -5px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--muted); }
.head { position: absolute; top: 9px; left: 5px; width: 44px; height: 30px; border-radius: 10px; background: var(--bot); }
.face { position: absolute; inset: 5px 5px; border-radius: 6px; background: var(--bot-face); }
.eye { position: absolute; top: 6px; width: 7px; height: 8px; border-radius: 3px; background: var(--bot-eye); }
.eye.l { left: 7px; } .eye.r { right: 7px; }
.body { position: absolute; top: 41px; left: 11px; width: 32px; height: 20px; border-radius: 7px 7px 4px 4px; background: var(--bot); }
.arm { position: absolute; top: 44px; width: 7px; height: 18px; border-radius: 4px; background: var(--bot); transform-origin: 50% 3px; }
.arm.l { left: 3px; transform: rotate(18deg); } .arm.r { right: 3px; transform: rotate(-18deg); }
.desk { position: absolute; left: 4px; right: 4px; bottom: 6px; height: 22px; border-radius: 5px; background: var(--desk); }
.screen { position: absolute; left: 50%; bottom: 22px; width: 46px; height: 30px; margin-left: -23px; border-radius: 4px; background: var(--screen); border: 2px solid var(--bot); opacity: 0; }
.screen::before { content: ""; position: absolute; inset: 4px; background: repeating-linear-gradient(180deg, var(--screen-glow) 0 2px, transparent 2px 6px); opacity: 0.8; background-size: 100% 12px; }
.mark { position: absolute; top: -2px; right: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--gold); opacity: 0; }

/* Estados */
.s-livre .bot { animation: bob 3.2s ease-in-out infinite; }
.s-livre .eye { animation: blink 4.5s infinite; }
.s-trabalhando .led { background: var(--screen-glow); animation: pulse 1s ease-in-out infinite; }
.s-trabalhando .screen { opacity: 1; z-index: 2; }
.s-trabalhando .screen::before { animation: code 1.4s linear infinite; }
.s-trabalhando .bot { transform: translateY(-10px); }
.s-trabalhando .arm.l { animation: typeL 0.35s ease-in-out infinite alternate; }
.s-trabalhando .arm.r { animation: typeR 0.35s ease-in-out infinite alternate-reverse; }
.s-trabalhando .eye { height: 4px; top: 8px; }
.s-aguardando .led { background: var(--gold); animation: pulse 1.6s ease-in-out infinite; }
.s-aguardando .arm.r { transform: rotate(-160deg); animation: wave 1.2s ease-in-out infinite; }
.s-aguardando .mark { opacity: 1; animation: pop 1.6s ease-in-out infinite; }
.s-bloqueado .led { background: var(--red); }
.s-bloqueado .eye { background: var(--red); height: 3px; top: 9px; }
.s-bloqueado .arm { transform: rotate(0deg); }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes code { from { background-position: 0 0; } to { background-position: 0 -12px; } }
@keyframes typeL { from { transform: rotate(-35deg); } to { transform: rotate(-55deg); } }
@keyframes typeR { from { transform: rotate(35deg); } to { transform: rotate(55deg); } }
@keyframes wave { 0%, 100% { transform: rotate(-160deg); } 50% { transform: rotate(-135deg); } }
@keyframes pop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

/* Conversa */
.chat { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; height: 100vh; height: 100dvh; position: sticky; top: 0; }
.chat[hidden] { display: none; }
.chat-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.chat-head .scene { width: 64px; height: 60px; transform: scale(0.72); transform-origin: left center; margin-right: -14px; }
.chat-head .scene .desk, .chat-head .scene .screen { display: none; }
.chat-head .scene .bot { bottom: 0; }
.chat-head h2 { font-size: 18px; font-weight: 400; }
.chat-head p { font-size: 13px; color: var(--muted); }
.close { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; }
.now { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.now strong { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.steps { margin: 0; padding: 0 0 0 16px; color: var(--muted); max-height: 130px; overflow-y: auto; }
.steps li { margin: 2px 0; }
.steps li:last-child { color: var(--fg); }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.voce { align-self: flex-end; background: var(--green-soft); border-bottom-right-radius: 4px; }
.msg.agente { align-self: flex-start; background: var(--room); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.empty-chat { color: var(--muted); font-size: 14px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.suggest button:hover { border-color: var(--gold); }
.composer { border-top: 1px solid var(--line); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.composer textarea { width: 100%; min-height: 70px; max-height: 180px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.composer-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); flex: 1; min-width: 160px; }
.send { min-height: 38px; padding: 6px 16px; border-radius: 8px; border: 1px solid var(--green); background: var(--green); color: var(--surface); font-weight: 600; cursor: pointer; }
.send:disabled { opacity: 0.55; cursor: not-allowed; }
.approve { display: flex; gap: 8px; flex-wrap: wrap; }
.approve button { min-height: 34px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; }
.approve button.ok { background: var(--green); border-color: var(--green); color: var(--surface); }

/* Abas e entregas */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); width: fit-content; }
.tabs a { padding: 7px 16px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--brand); color: var(--surface); }
.tabs .count { margin-left: 4px; font-variant-numeric: tabular-nums; }
.deliveries { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.dcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
.dcard:hover { border-color: var(--brand); }
.dthumb { aspect-ratio: 4 / 5; background: var(--room); display: grid; place-items: center; overflow: hidden; }
.dthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dthumb .doc { font-family: var(--display); font-size: 16px; color: var(--fg); padding: 22px; text-align: center; line-height: 1.35; }
.dthumb .doc small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); margin-top: 8px; }
.dbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.dbody strong { font-size: 14.5px; line-height: 1.3; }
.dbody span { font-size: 12.5px; color: var(--muted); }
.t-aguardando_aprovacao { background: var(--gold-soft); color: var(--gold); }
.t-aprovada, .t-entregue { background: var(--green-soft); color: var(--green); }
.t-ajustar { background: var(--red-soft); color: var(--red); }
.empty-deliv { padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); background: var(--surface); }
.viewer { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) 64px; }
.viewer[hidden] { display: none; }
.viewer-inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.vhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.vhead h2 { font-size: clamp(20px, 3vw, 28px); font-weight: 400; }
.vhead p { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.vactions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 38px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--brand); }
.btn.ok { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.item-row strong { font-size: 14px; }
.item img { max-width: 100%; height: auto; max-height: 82vh; border-radius: 8px; display: block; margin: 0 auto; }
.md { font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; min-width: 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); font-weight: 400; margin: 20px 0 8px; }
.md h1 { font-size: 24px; } .md h2 { font-size: 20px; } .md h3 { font-size: 17px; }
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 8px 0 14px; font-size: 14px; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
.md code { background: var(--room); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.md pre { background: var(--room); padding: 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--brand); }
.feedback { font-size: 13px; color: var(--muted); }
.agent-deliv { display: flex; flex-direction: column; gap: 6px; }
.agent-deliv button { text-align: left; border: 1px solid var(--line); background: var(--room); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
.agent-deliv button:hover { border-color: var(--brand); }

@media (max-width: 860px) {
  .app.open { grid-template-columns: minmax(0, 1fr); }
  .chat { position: fixed; inset: auto 0 0 0; height: 78dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; z-index: 20; box-shadow: 0 -10px 30px color-mix(in oklab, var(--fg) 18%, transparent); }
}
</style>

<div class="app" id="app">
  <main class="office">
    <div class="top">
      <div>
        <small>Maya Protege, marketing digital</small>
        <h1>Escritório <span>Maya</span></h1>
      </div>
      <div class="stats" aria-label="Resumo">
        <span class="stat"><b id="n-work">0</b> trabalhando</span>
        <span class="stat"><b id="n-wait">0</b> esperando você</span>
        <span class="stat"><b id="n-block">0</b> bloqueados</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <a href="#escritorio" id="tab-office" aria-current="page">Escritório</a>
      <a href="#entregas" id="tab-deliv">Entregas<span class="count" id="n-deliv"></span></a>
    </nav>
    <p class="sync" id="sync" aria-live="polite">Ligando o escritório…</p>
    <div class="floor" id="floor"></div>
    <section id="view-deliveries" hidden aria-label="Entregas da equipe">
      <div class="deliveries" id="deliveries"></div>
    </section>
  </main>
  <aside class="chat" id="chat" hidden aria-label="Conversa com o agente"></aside>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Entrega"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<script>
const TEAM = [
  { area: "Coordenação", agents: [["diretor", "Diretor de Marketing", "Recebe o pedido, distribui para a equipe e entrega."]] },
  { area: "Mídia paga e performance", agents: [["gestor-meta-ads", "Gestor de Meta Ads", "Campanhas no Facebook e no Instagram."], ["gestor-google-ads", "Gestor de Google Ads", "Pesquisa, Display, YouTube e PMax."]] },
  { area: "Marketing digital e growth", agents: [["estrategista-growth", "Estrategista de Growth", "Aquisição, leads, landing pages e experimentos."]] },
  { area: "Conteúdo e marca", agents: [["social-media", "Social Media", "Calendário e perfis orgânicos."], ["copywriter", "Copywriter", "Textos de anúncio, títulos e CTAs."], ["diretor-de-arte", "Diretor de Arte", "Peças em PNG no tamanho certo."], ["guardiao-da-marca", "Guardião da Marca", "Revisão final: marca, promessas e políticas."]] },
  { area: "Dados e mensuração", agents: [["analista-de-mensuracao", "Analista de Mensuração", "GTM, GA4, pixel e conversões."], ["especialista-utm", "Especialista em UTM", "Links rastreáveis no padrão."], ["analista-de-campanhas", "Analista de Campanhas", "CPC, CPL, CPA, ROAS, ROI e ranking."]] },
  { area: "Integração comercial", agents: [["analista-de-funil", "Analista de Funil", "Lead qualificado e devolutiva de vendas."]] },
];
const INFO = {}; TEAM.forEach(g => g.agents.forEach(([k, n, r]) => INFO[k] = { name: n, role: r, area: g.area }));
const SUGGEST = {
  "diretor": ["O que a equipe está fazendo agora?", "Planeje a primeira campanha de leads"],
  "gestor-meta-ads": ["Monte a estrutura de uma campanha de leads", "Como evitar fadiga de criativo?"],
  "gestor-google-ads": ["Sugira palavras negativas iniciais", "Qual tipo de campanha usar primeiro?"],
  "estrategista-growth": ["Crie um briefing de campanha", "Revise a minha landing page"],
  "social-media": ["Monte o calendário do mês", "Sugira linhas editoriais"],
  "copywriter": ["Escreva 5 títulos para anúncio", "Crie variações para teste A/B"],
  "diretor-de-arte": ["Crie uma peça para o feed", "Proponha 3 conceitos visuais"],
  "guardiao-da-marca": ["O que falta confirmar da marca?", "Revise este texto"],
  "analista-de-mensuracao": ["Monte o plano de tags do GTM", "Como instalar a captura de origem?"],
  "especialista-utm": ["Gere os parâmetros para Meta e Google", "Crie um link com UTM"],
  "analista-de-campanhas": ["Como exporto os relatórios?", "Qual campanha performa melhor?"],
  "analista-de-funil": ["Defina o que é lead qualificado", "Monte a devolutiva de vendas"],
};
const LABEL = { livre: "Livre", trabalhando: "Trabalhando", aguardando: "Esperando você", bloqueado: "Bloqueado" };

const state = { agents: {}, msgs: [], tasks: [], approvals: {}, entregas: [], open: null, drafts: {}, view: "office", entrega: null };
let db = null, comments = null, downloads = null, canSend = "off";
const DSTATUS = { aguardando_aprovacao: "Aguardando aprovação", aprovada: "Aprovada", ajustar: "Ajuste pedido", entregue: "Entregue" };
const blobUrl = id => "/_blob/" + id;
const threads = {};
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmt = iso => { try { return new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(new Date(iso)); } catch { return ""; } };
const statusOf = k => LABEL[state.agents[k]?.status] ? state.agents[k].status : "livre";

function robot() {
  const s = el("div", "scene");
  s.innerHTML = '<div class="desk"></div><div class="bot"><div class="antenna"></div><div class="led"></div><div class="head"><div class="face"><div class="eye l"></div><div class="eye r"></div></div></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><span class="mark">!</span></div><div class="screen"></div>';
  return s;
}

function bubbleText(k) {
  const a = state.agents[k] || {}; const st = statusOf(k);
  if (a.fala) return a.fala;
  if (st === "trabalhando") return a.tarefa || "Trabalhando…";
  if (st === "aguardando") return a.tarefa || "Preciso de você";
  if (st === "bloqueado") return a.tarefa || "Travado: preciso de informação";
  return "Pronto para ajudar";
}

function renderFloor() {
  const floor = $("floor"); floor.replaceChildren();
  for (const g of TEAM) {
    const room = el("section", "room"); room.append(el("h2", null, g.area));
    const desks = el("div", "desks");
    for (const [k] of g.agents) {
      const st = statusOf(k);
      const b = el("button", "station s-" + st); b.type = "button"; b.dataset.agent = k;
      b.setAttribute("aria-pressed", String(state.open === k));
      b.setAttribute("aria-label", INFO[k].name + ", " + LABEL[st] + ". Abrir conversa");
      const bub = el("span", "bubble" + (st === "livre" && !state.agents[k]?.fala ? " quiet" : "") + (st === "aguardando" ? " alert" : ""), bubbleText(k));
      b.append(bub, robot(), el("span", "name", INFO[k].name), el("span", "tag t-" + st, LABEL[st]));
      b.addEventListener("click", () => openChat(k));
      desks.append(b);
    }
    room.append(desks); floor.append(room);
  }
  const all = Object.keys(INFO).map(statusOf);
  $("n-work").textContent = all.filter(s => s === "trabalhando").length;
  $("n-wait").textContent = all.filter(s => s === "aguardando").length;
  $("n-block").textContent = all.filter(s => s === "bloqueado").length;
}

function openChat(k) { state.open = state.open === k ? null : k; renderAll(); if (state.open) setTimeout(() => $("msg-input")?.focus(), 0); }

function renderChat() {
  const chat = $("chat"), app = $("app");
  const k = state.open;
  if (!k) { chat.hidden = true; app.classList.remove("open"); return; }
  chat.hidden = false; app.classList.add("open"); chat.replaceChildren();
  const st = statusOf(k), a = state.agents[k] || {};

  const head = el("div", "chat-head");
  const sc = el("div", "s-" + st); sc.append(robot()); sc.firstChild.id = "chat-bot";
  const t = el("div"); t.append(el("h2", null, INFO[k].name), el("p", null, INFO[k].role));
  const close = el("button", "close", "×"); close.type = "button"; close.setAttribute("aria-label", "Fechar conversa");
  close.addEventListener("click", () => { state.open = null; renderAll(); });
  head.append(sc, t, close); chat.append(head);

  const now = el("div", "now");
  now.append(el("strong", null, LABEL[st] + (a.atualizado ? " desde " + fmt(a.atualizado) : "")));
  if (a.tarefa) now.append(el("span", null, a.tarefa));
  if ((a.passos || []).length) { const ol = el("ol", "steps"); a.passos.slice(-12).forEach(p => ol.append(el("li", null, p.texto || p))); now.append(ol); setTimeout(() => { ol.scrollTop = ol.scrollHeight; }, 0); }
  const waiting = state.tasks.filter(x => x.status === "aguardando_aprovacao" && (x.agente === k || (x.participantes || []).includes(k)) && !state.approvals[x.id]);
  for (const task of waiting) {
    now.append(el("span", null, "Para aprovar: " + (task.titulo || "tarefa")));
    const row = el("div", "approve");
    const ok = el("button", "ok", "Aprovar"); ok.type = "button";
    const fix = el("button", null, "Pedir ajuste"); fix.type = "button";
    const decide = async d => { ok.disabled = fix.disabled = true; try { await db.collection("aprovacoes").doc(task.id).set({ decisao: d, comentario: "", em: new Date().toISOString(), tarefa: task.titulo || "" }); if (d === "ajustar") { state.drafts[k] = "Ajuste em \"" + (task.titulo || "") + "\": "; renderAll(); $("msg-input")?.focus(); } } catch { ok.disabled = fix.disabled = false; } };
    ok.addEventListener("click", () => decide("aprovado")); fix.addEventListener("click", () => decide("ajustar"));
    row.append(ok, fix); now.append(row);
  }
  const mineDeliv = state.entregas.filter(x => x.agente === k).slice(0, 5);
  if (mineDeliv.length) {
    now.append(el("strong", null, "Entregas"));
    const box = el("div", "agent-deliv");
    mineDeliv.forEach(x => { const b = el("button", null, (x.titulo || "Entrega") + "  (" + (DSTATUS[x.status] || "Entregue") + ")"); b.type = "button"; b.addEventListener("click", () => openEntrega(x.id)); box.append(b); });
    now.append(box);
  }
  chat.append(now);

  const list = el("div", "msgs"); list.setAttribute("aria-live", "polite");
  const mine = state.msgs.filter(m => m.agente === k);
  if (!mine.length) {
    const e = el("div", "empty-chat", "Diga o que você precisa. A mensagem vai para a sessão do Claude Code, que coloca este agente para trabalhar. Você vê o robô trabalhando e a resposta aparece aqui.");
    const sg = el("div", "suggest");
    (SUGGEST[k] || []).forEach(s => { const b = el("button", null, s); b.type = "button"; b.addEventListener("click", () => { state.drafts[k] = s; renderAll(); $("msg-input")?.focus(); }); sg.append(b); });
    e.append(sg); list.append(e);
  }
  for (const m of mine) { const b = el("div", "msg " + (m.de === "voce" ? "voce" : "agente"), m.texto); const tm = el("time", null, fmt(m.em) + (m.de === "voce" && m.entrega ? " · " + m.entrega : "")); b.append(tm); list.append(b); }
  chat.append(list); setTimeout(() => { list.scrollTop = list.scrollHeight; }, 0);

  const form = el("form", "composer");
  const ta = el("textarea"); ta.id = "msg-input"; ta.dataset.agent = k; ta.maxLength = 1500; ta.value = state.drafts[k] || "";
  ta.placeholder = "Escreva para " + INFO[k].name + "…"; ta.setAttribute("aria-label", "Mensagem para " + INFO[k].name);
  const row = el("div", "composer-row");
  const hint = el("span", "hint", state.hint?.[k] || (canSend === "available" ? "Vai direto para a sessão do Claude Code. Enter envia, Shift+Enter quebra a linha." : "A sessão do Claude Code não está ouvindo agora: a mensagem fica guardada e é lida quando você disser \"leia as mensagens do escritório\" na conversa.")); hint.id = "composer-hint";
  const send = el("button", "send", "Enviar"); send.type = "submit";
  row.append(hint, send); form.append(ta, row); chat.append(form);
  ta.addEventListener("input", () => { state.drafts[k] = ta.value; });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", async e => {
    e.preventDefault(); const text = (state.drafts[k] || ta.value).trim(); if (!text || !db) return;
    // Limpa a caixa ANTES de gravar: a gravação redesenha a tela na hora.
    state.drafts[k] = ""; ta.value = "";
    const setHint = t => { state.hint = state.hint || {}; state.hint[k] = t; const h = $("composer-hint"); if (h) h.textContent = t; };
    const ref = db.collection("mensagens").doc();
    const msg = { agente: k, de: "voce", texto: text, em: new Date().toISOString(), entrega: "guardada" };
    try { await ref.set(msg); } catch (err) { state.drafts[k] = text; renderAll(); setHint("Não foi possível guardar a mensagem (" + err.code + "). O texto voltou para a caixa."); return; }
    if (comments) {
      try { canSend = await comments.canSendToClaude(); } catch { canSend = "off"; }
      if (canSend === "available") {
        const body = "[Escritório Maya] Para: " + INFO[k].name + " (" + k + ")\nMensagem " + ref.id + ":\n" + text;
        try {
          const target = threads[k] ? { threadId: threads[k], text: body } : { anchor: await comments.anchorFor(document.querySelector('.station[data-agent="' + k + '"]') || $("chat")), text: body };
          const r = await comments.sendToClaude(target); threads[k] = r.threadId;
          await ref.update({ entrega: "enviada ao Claude" });
        } catch (err) { setHint("Guardada, mas não foi enviada agora (" + (err.code || "erro") + "). Diga \"leia as mensagens do escritório\" na conversa."); }
      }
    }
  });
}

function renderDeliveries() {
  const n = state.entregas.length; $("n-deliv").textContent = n ? String(n) : "";
  const office = state.view === "office";
  $("floor").hidden = !office; $("view-deliveries").hidden = office;
  $("tab-office").toggleAttribute("aria-current", office); $("tab-deliv").toggleAttribute("aria-current", !office);
  if (office) $("tab-office").setAttribute("aria-current", "page"); else $("tab-deliv").setAttribute("aria-current", "page");
  if (office) return;
  const root = $("deliveries"); root.replaceChildren();
  if (!n) { root.append(el("div", "empty-deliv", "Nenhuma entrega ainda. Quando um robô terminar um trabalho, ele aparece aqui para você ver, baixar e aprovar.")); return; }
  for (const x of state.entregas) {
    const c = el("button", "dcard"); c.type = "button";
    const th = el("div", "dthumb");
    const img = (x.itens || []).find(i => i.tipo === "imagem" && i.asset);
    if (img) { const im = el("img"); im.src = blobUrl(img.asset); im.alt = ""; im.loading = "lazy"; th.append(im); }
    else { const d = el("div", "doc", x.titulo || "Documento"); d.append(el("small", null, ((x.itens || []).length || 1) + " arquivo(s)")); th.append(d); }
    const body = el("div", "dbody");
    body.append(el("strong", null, x.titulo || "Entrega"), el("span", null, (INFO[x.agente]?.name || x.agente || "") + ", " + fmt(x.criada)));
    const st = state.approvals[x.id]?.decisao === "aprovado" ? "aprovada" : state.approvals[x.id]?.decisao === "ajustar" ? "ajustar" : (x.status || "entregue");
    body.append(el("span", "tag t-" + st, DSTATUS[st] || st));
    c.append(th, body); c.addEventListener("click", () => openEntrega(x.id)); root.append(c);
  }
}

function openEntrega(id) { state.entrega = id; renderViewer(); }

async function baixar(item, btn) {
  if (!downloads) { btn.textContent = "Download indisponível aqui"; return; }
  btn.disabled = true;
  try {
    let data;
    if (item.tipo === "imagem") data = await (await fetch(blobUrl(item.asset))).blob();
    else data = item.conteudo || "";
    await downloads.save({ filename: item.arquivo || item.nome || "entrega.txt", data });
  } catch (e) { btn.textContent = "Não foi possível baixar"; }
  btn.disabled = false;
}

function renderViewer() {
  const v = $("viewer"); const x = state.entregas.find(e => e.id === state.entrega);
  if (!x) { v.hidden = true; v.replaceChildren(); return; }
  v.hidden = false; v.replaceChildren();
  const inner = el("div", "viewer-inner");
  const head = el("div", "vhead"); const t = el("div");
  t.append(el("h2", null, x.titulo || "Entrega"), el("p", null, (INFO[x.agente]?.name || x.agente || "") + ", " + fmt(x.criada) + (x.resumo ? ". " + x.resumo : "")));
  const close = el("button", "close", "×"); close.type = "button"; close.setAttribute("aria-label", "Fechar entrega");
  close.addEventListener("click", () => { state.entrega = null; renderViewer(); });
  head.append(t, close); inner.append(head);
  const dec = state.approvals[x.id];
  const acts = el("div", "vactions");
  if (dec) acts.append(el("span", "feedback", (dec.decisao === "aprovado" ? "Você aprovou" : "Você pediu ajuste") + " em " + fmt(dec.em) + "."));
  else if (x.status === "aguardando_aprovacao" && db) {
    const ok = el("button", "btn ok", "Aprovar"); ok.type = "button";
    const fix = el("button", "btn", "Pedir ajuste"); fix.type = "button";
    const decide = async d => { ok.disabled = fix.disabled = true; try { await db.collection("aprovacoes").doc(x.id).set({ decisao: d, comentario: "", em: new Date().toISOString(), tarefa: x.titulo || "" }); if (d === "ajustar" && x.agente && INFO[x.agente]) { state.drafts[x.agente] = "Ajuste em \"" + (x.titulo || "") + "\": "; state.entrega = null; renderViewer(); state.open = x.agente; renderAll(); $("msg-input")?.focus(); } } catch { ok.disabled = fix.disabled = false; } };
    ok.addEventListener("click", () => decide("aprovado")); fix.addEventListener("click", () => decide("ajustar"));
    acts.append(ok, fix);
  }
  if (x.agente && INFO[x.agente]) { const talk = el("button", "btn", "Falar com " + INFO[x.agente].name); talk.type = "button"; talk.addEventListener("click", () => { state.entrega = null; renderViewer(); state.open = x.agente; renderAll(); }); acts.append(talk); }
  inner.append(acts);
  for (const item of (x.itens || [])) {
    const box = el("section", "item"); const row = el("div", "item-row");
    row.append(el("strong", null, item.nome || "Arquivo"));
    const dl = el("button", "btn", "Baixar"); dl.type = "button"; dl.addEventListener("click", () => baixar(item, dl)); row.append(dl);
    box.append(row);
    if (item.tipo === "imagem" && item.asset) { const im = el("img"); im.src = blobUrl(item.asset); im.alt = item.descricao || item.nome || ""; if (item.largura) { im.width = item.largura; im.height = item.altura; } box.append(im); }
    else if (item.conteudo) {
      const md = el("div", "md");
      if (window.marked && window.DOMPurify) md.innerHTML = DOMPurify.sanitize(marked.parse(item.conteudo));
      else md.textContent = item.conteudo;
      md.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
      box.append(md);
    }
    inner.append(box);
  }
  v.append(inner); v.scrollTop = 0;
}

function route() { state.view = location.hash === "#entregas" ? "deliveries" : "office"; renderAll(); }
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.entrega) { state.entrega = null; renderViewer(); } });

function renderAll() {
  const active = document.activeElement?.id;
  renderFloor(); renderDeliveries(); renderChat();
  if (state.entrega) renderViewer();
  if (active === "msg-input") { const t = $("msg-input"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
}

route();

(async () => {
  [db, comments, downloads] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("comments"), window.claude?.use?.("downloads")]);
  const sync = $("sync");
  if (comments) { try { canSend = await comments.canSendToClaude(); } catch { canSend = "off"; } }
  if (!db) { sync.textContent = "O escritório ao vivo só funciona aberto no claude.ai, com a sua conta."; sync.className = "sync warn"; return; }
  const timer = setTimeout(() => { sync.textContent = "O escritório ainda não respondeu. Pode estar desatualizado."; sync.className = "sync warn"; }, 10000);
  const live = m => { if (!m.fromCache) { clearTimeout(timer); sync.textContent = canSend === "available" ? "Ao vivo, e a sessão do Claude Code está ouvindo. Clique em um robô para falar com ele." : "Ao vivo. Clique em um robô para falar com ele."; sync.className = "sync"; } };
  const fail = e => { clearTimeout(timer); sync.textContent = "Conexão perdida (" + e.code + "). Recarregue a página."; sync.className = "sync warn"; };
  db.collection("agentes").onSnapshot(s => { state.agents = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); live(s.metadata); renderAll(); }, fail);
  db.collection("mensagens").orderBy("em", "asc").limit(1000).onSnapshot(s => { state.msgs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }, fail);
  db.collection("tarefas").orderBy("atualizada", "desc").limit(100).onSnapshot(s => { state.tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }, fail);
  db.collection("entregas").orderBy("criada", "desc").limit(300).onSnapshot(s => { state.entregas = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }, fail);
  db.collection("aprovacoes").onSnapshot(s => { state.approvals = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); renderAll(); }, fail);
})();
</script>
